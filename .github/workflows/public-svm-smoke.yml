name: Public SVM browser smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.65.2
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Verify live uploads and microphone capture
        run: python tests/verify_public_svm.py
      - name: Save browser screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-svm-browser
          path: reports/public-svm-smoke/
